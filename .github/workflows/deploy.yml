# Deploy to the PoC instance, without a credential in anybody's chat window.
#
# WHY THIS EXISTS. Deploying used to mean: a person with AWS keys runs
# `update.sh` over SSM from whatever machine they happen to be on. That
# blocked twice in one week when the session holding those keys was
# recycled, and it meant long-lived access keys travelling through chat to
# get the job done. This workflow authenticates with OIDC instead — GitHub
# hands AWS a short-lived token minted for this repository, AWS hands back
# credentials that expire in minutes, and nothing durable is stored
# anywhere. There is no access key to leak, rotate, or lose with a
# container.
#
# WHAT IT ACTUALLY DOES. One commit, pinned once, carried through every job:
#   resolve      turns the push (or the branch a person typed) into ONE
#                commit sha. Every later job uses that sha, and a re-run of
#                failed jobs reuses it — no job looks the branch up again.
#   test         the server suite on that commit, against a real Postgres —
#                the gate
#   web-build    builds the screens HERE, on GitHub's machine (since 8 Oct:
#                building on the small instance is the likeliest reason a
#                deploy took the PoC down for ~7 hours). Read-only token.
#   web-publish  publishes that build to this repository as the tag
#                web-build/<sha>. The only job that can write, and it runs
#                no npm — third-party build code never sees a write token.
#   deploy       after all of them: one SSM command. The instance downloads
#                the bundle instead of building it and restarts. update.sh
#                and its helpers run from the commit being deployed.
#
# SETUP IS NOT OPTIONAL AND IS NOT DONE HERE: see
# docs/DEPLOY-GITHUB-ACTIONS.md for the IAM role, its trust policy and the
# three repository settings. Until those exist the deploy job SKIPS with a
# message rather than failing red, so merging this does not start breaking
# the default branch.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy (blank = main). A branch only — not a tag or a commit'
        required: false
        default: 'main'

# One deploy at a time. Two overlapping runs of update.sh would fight over
# the same checkout and the same systemd unit. Queued, not cancelled: a
# half-finished deploy is worse than a slightly stale one.
concurrency:
  group: deploy-poc
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # required to mint the OIDC token

# RUNNERS AND ACTION VERSIONS, set on 7 Oct after two GitHub notices:
#   - ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026. Pinned to 24.04 so
#     the test job's Postgres service and Node install do not change under
#     a deploy without anyone choosing it. Moving up is a one-word edit,
#     made deliberately, with a run to prove it.
#   - Node 20 is retired on GitHub runners. checkout and setup-node v5 and
#     configure-aws-credentials v6 are their first Node 24 releases (each
#     needs runner >= 2.327.1, which GitHub-hosted runners have).
jobs:
  # -------------------------------------------------------------- resolve
  # The one place the branch is turned into a commit. Before this, the test
  # job and the build each looked up the branch on their own, so a push
  # landing between them — or a "Re-run failed jobs" after one — could
  # build and deploy a commit the tests never ran on.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      branch: ${{ steps.r.outputs.branch }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            BRANCH="$GITHUB_REF_NAME"; SHA="$GITHUB_SHA"
          else
            BRANCH="${INPUT_REF:-main}"
            # It reaches a root shell on the instance; a branch name
            # cannot contain anything outside this set.
            case "$BRANCH" in
              ''|*[!A-Za-z0-9._/-]*) echo "::error::Refusing ref '${BRANCH}' — expected only [A-Za-z0-9._/-]"; exit 1 ;;
            esac
            # A branch, exactly: the Git refs API answers 404 for a tag, a
            # commit or a partial name. A deploy follows a branch (see
            # update.sh) — a tag or a sha would leave the box detached.
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha) \
              || { echo "::error::'${BRANCH}' is not a branch of this repository."; exit 1; }
          fi
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::no commit for '${BRANCH}'"; exit 1 ;; esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "### Deploying \`${SHA:0:7}\` from \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- tests
  # The gate. An automatic deploy with no gate is worse than a manual one,
  # because the human who used to run the suite by hand is now out of the
  # loop. The server suite needs a real Postgres; it creates its own schema.
  #
  # The browser suite is NOT here: it needs the API, Vite and Chromium all
  # running together, which is a different and much slower job. That is a
  # real gap — it is the suite that catches layout and nav regressions —
  # and it stays a pre-merge step run locally until somebody builds it.
  test:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: apms_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit resolve pinned — the one that is built and deployed.
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      # The failing test names go into the job summary AND into
      # annotations. Raw logs are served from a blob host that some API
      # clients will not follow, so "the gate went red" was readable and
      # "which test" was not — on the very first run of this workflow.
      # Annotations come back from the check-runs API, so the answer is
      # reachable by whoever (or whatever) is looking.
      - name: Run the server suite
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/apms_ci
          # core/db.js defaults SSL ON and only turns it off for this exact
          # value. That default is right — the managed Postgres this ships
          # against requires TLS, and defaulting to plaintext is the kind
          # of default nobody notices. It cost a red run here because the
          # postgres:16 image serves plaintext while the Ubuntu package a
          # developer has locally enables SSL with a snakeoil cert, so the
          # suite passed on a laptop and failed on the runner with "The
          # server does not support SSL connections".
          DATABASE_SSL: 'false'
        run: |
          set -o pipefail
          FAILED=
          npm test 2>&1 | tee /tmp/suite.log || FAILED=1
          {
            echo '### Server suite'
            echo '```'
            grep -E '^# (tests|pass|fail|skipped)' /tmp/suite.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAILED" ]; then
            {
              echo '#### Failures'
              echo '```'
              grep -E '^not ok ' /tmp/suite.log | head -50 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # The DISTINCT error messages, not only the test names. A
            # suite that fails wholesale usually fails for one reason, and
            # the reason is in the `error:` lines — naming twenty tests
            # says how bad it is, not what happened.
            {
              echo '#### Distinct errors'
              echo '```'
              grep -hoE "error: .*" /tmp/suite.log | sort | uniq -c | sort -rn | head -15 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -hoE "error: .*" /tmp/suite.log | sort -u | head -8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -E '^not ok ' /tmp/suite.log | head -12 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  # ------------------------------------------------------------ web-build
  # The screens, built on GitHub's runner — see deploy/service/web-bundle.sh.
  # Runs alongside the tests: building is harmless on its own, because
  # nothing deploys it until the tests have passed. READ-ONLY: npm ci runs
  # every install script in the dependency tree and vite runs its plugins,
  # so this job gets no write token and keeps no credentials in .git.
  web-build:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the screens
        working-directory: frontend
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected ${SHA}"; exit 1; }
          # VITE_API_URL stays UNSET on purpose — see install.sh and
          # frontend/src/utils/api.jsx: the bundle calls the relative
          # /api/v1 that nginx proxies.
          unset VITE_API_URL
          npm ci --no-audit --no-fund
          npm run build
          # The same completeness and commit-stamp check the instance makes.
          . ../deploy/service/web-bundle.sh
          check_web_bundle dist "$SHA"
          echo "### Screens built for \`${SHA:0:7}\` ($(du -sh dist | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------- web-publish
  # The only job that writes, and it runs nothing from npm: git, and the
  # repository's own deploy/service/web-bundle.sh at the pinned commit.
  # contents: write cannot be narrowed to a ref prefix; keeping the token
  # away from the build is what limits it.
  web-publish:
    needs: [resolve, web-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          # Enough of main to know which bundles are still worth keeping.
          fetch-depth: 50
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-dist
      - name: Publish the bundle
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          DIST: ${{ runner.temp }}/web-dist
        run: |
          set -euo pipefail
          . deploy/service/web-bundle.sh
          check_web_bundle "$DIST" "$SHA"
          publish_web_bundle . "$DIST" "$SHA"
      - name: Remove old bundles
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -uo pipefail
          . deploy/service/web-bundle.sh
          # main's recent history decides which bundles are kept — always
          # main, also on a manual run of another branch, so that run can
          # never delete the bundles main's re-runs need. The one just
          # published is kept by name. If main cannot be read, the prune
          # keeps everything rather than guess. Housekeeping only: a failure
          # here is a warning, never a reason to hold back the deploy.
          git fetch -q --depth=50 origin '+refs/heads/main:refs/remotes/origin/main' || true
          prune_remote_web_bundles . 30 main "$SHA" \
            || echo "::warning::Could not remove old web bundles; they will be tried again next run."

  # ------------------------------------------------------------ preflight
  # `secrets` is not available in a job-level `if`, so the check happens in
  # a step and is published as an output. This is what lets the deploy skip
  # cleanly on a repository that has not been wired to AWS yet.
  preflight:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        # Read through env, never interpolated into the script body. A
        # `${{ secrets.X }}` written inline becomes part of the shell text
        # before bash sees it, so a value containing shell metacharacters
        # would execute. Nothing here is attacker-controlled today; the
        # habit is what matters, because the next person copies this block.
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$INSTANCE" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deploy skipped — AWS_DEPLOY_ROLE_ARN and/or EC2_INSTANCE_ID are not set. See docs/DEPLOY-GITHUB-ACTIONS.md.'
          fi

  # --------------------------------------------------------------- deploy
  deploy:
    needs: [resolve, preflight, web-publish]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Add required reviewers to this environment in repository settings to
    # make production deploys need a human approval.
    environment: production
    steps:
      - name: Assume the deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Run update.sh on the instance
        id: ssm
        env:
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
          REF: ${{ needs.resolve.outputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # REF reaches a root shell on the instance. It comes from a
          # workflow_dispatch input, so it is typed by a person — one who
          # can already deploy, but "they could do it anyway" is not a
          # reason to pass unvalidated text into a remote command line.
          # A git ref cannot contain anything outside this set.
          case "$REF" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "::error::Refusing ref '${REF}' — expected only [A-Za-z0-9._/-]"; exit 1 ;;
          esac
          # The commit resolve pinned: the one tested, built and published.
          case "$SHA" in
            *[!0-9a-f]*|'') echo "::error::no commit from the resolve job ('${SHA}')"; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::expected a full commit sha, got '${SHA}'"; exit 1; }
          echo "Deploying ${SHA:0:7} on '${REF}'"
          # update.sh and its helpers run from a copy taken out of the
          # commit being deployed, so a change to the deploy scripts takes
          # effect in the deploy that ships it — the box's own copy is the
          # PREVIOUS version until this run moves the checkout. Built with
          # jq so the JSON quoting is jq's problem, not a hand-escaped one;
          # SHA and REF are already validated to [0-9a-f] and [A-Za-z0-9._/-].
          REMOTE='set -euo pipefail; D=$(mktemp -d); trap "rm -rf \"$D\"" EXIT; git -C /opt/agentic-pms fetch -q --no-tags origin; git -C /opt/agentic-pms archive "$1" deploy/service | tar -x -C "$D"; "$D/deploy/service/update.sh" "$2" "$1"'
          PARAMS=$(jq -nc --arg remote "$REMOTE" --arg sha "$SHA" --arg ref "$REF" \
            '{commands: [("sudo bash -c " + ($remote | @sh) + " deploy " + $sha + " " + $ref)]}')
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "GH Actions deploy ${SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "command id: $CMD"

          # aws ssm wait command-executed returns non-zero on a failed
          # command, which would hide the output we actually need to read.
          # Poll instead, then decide on the real status.
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          OUT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' --output text || true)
          ERR=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardErrorContent' --output text || true)
          echo "----- stdout -----"; echo "$OUT"
          # Plain `if` rather than `[ -n "$ERR" ] && { ...; }`. Both are
          # safe under `set -e` — a failing test that is not the last
          # command of an && list is exempt — but the one-liner reads like
          # it might not be, and this runs on the path that deploys.
          if [ -n "$ERR" ]; then echo "----- stderr -----"; echo "$ERR"; fi
          {
            echo '### Deploy output'
            echo '```'; echo "$OUT"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$STATUS" = Success ] || { echo "::error::SSM command finished as ${STATUS}"; exit 1; }

          # A DEPLOY THAT MOVED NOTHING IS A FAILED DEPLOY, not a quiet
          # success. update.sh says so in as many words precisely because a
          # no-op once read as a real deploy and was believed for days —
          # that is what git-report.sh was added for. Catch it here too, or
          # the automation reintroduces the bug the script was written to
          # prevent.
          case "$OUT" in
            *"==> Already past "*)
              # A re-run of an older deploy: update.sh refuses to roll back
              # and touches nothing. Correct, and not a failure.
              echo "::notice::The box is already past ${SHA:0:7} — nothing deployed, nothing restarted." ;;
            *"NOTHING NEW was deployed"*)
              # No change is only a failure when the box is NOT already on
              # this commit. On 6 Oct the first working run found the box
              # already on it — somebody had run update.sh by hand minutes
              # earlier — and went red for doing exactly the right thing.
              AT=$(printf '%s' "$OUT" | sed -n 's/.*still at \([0-9a-f]\{7,\}\).*/\1/p' | tail -1)
              if [ -n "$AT" ] && [ "${SHA#"$AT"}" != "$SHA" ]; then
                echo "::notice::The box was already on ${AT} — nothing to deploy, and nothing wrong."
              else
                echo "::error::update.sh reported no change — the box is on ${AT:-an unknown commit}, not ${SHA:0:7}."
                exit 1
              fi ;;
            *"Healthy. Deployed "*)
              # And it moved to THIS commit, not merely somewhere.
              TO=$(printf '%s' "$OUT" | sed -n 's/.*Healthy\. Deployed [0-9a-f?]* -> \([0-9a-f]\{7,\}\).*/\1/p' | tail -1)
              if [ -n "$TO" ] && [ "${SHA#"$TO"}" != "$SHA" ]; then
                echo "Deploy moved the checkout to ${TO} and the API came back healthy."
              else
                echo "::error::update.sh deployed ${TO:-an unknown commit}, not ${SHA:0:7}."; exit 1
              fi ;;
            *) echo "::error::update.sh did not report a healthy finish."; exit 1 ;;
          esac

      - name: Verify the API answers
        env:
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["curl -fsS -o /dev/null -w %{http_code} http://127.0.0.1/api/v1/health","git -C /opt/agentic-pms rev-parse --short HEAD"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            S=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' --output text)
          echo "$OUT"
          echo "### Post-deploy check" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "$OUT" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          case "$OUT" in 200*) ;; *) echo "::error::health check did not return 200"; exit 1 ;; esac
