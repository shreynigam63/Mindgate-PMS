# Local dev: postgres + api. Frontend runs via `npm run dev` (vite).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: apms
    ports: ["5432:5432"]
  api:
    build: ../server
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/apms
      DATABASE_SSL: "false"
      JWT_SECRET: dev-only-secret
      TENANT_SLUG: dev
      AUTH_DEV: "true"
    ports: ["8080:8080"]
    depends_on: [db]
