# Agentic PMS — nginx site (native/systemd deployment on EC2).
#
# Installed to:
#   Debian/Ubuntu     /etc/nginx/sites-available/agentic-pms  (+ symlink)
#   Amazon Linux/RHEL /etc/nginx/conf.d/agentic-pms.conf
#
# One origin serves the React bundle from disk and proxies /api to the
# Node service on loopback. That is why VITE_API_URL is left UNSET when
# the frontend is built: unset makes the bundle call the relative
# '/api/v1', which lands here. Setting it would hardcode an https:// URL
# into the JavaScript (see frontend/src/utils/api.jsx) and require a
# rebuild every time the hostname changed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/agentic-pms;
    index index.html;

    # The API accepts evidence uploads up to 10 MB. nginx's default is
    # 1 MB and it rejects the request before the app sees it, so anything
    # smaller turns a working import into a bare 413 with none of the
    # app's per-row error reporting. Sized above the app's own limit so
    # the app is always the thing that says no.
    client_max_body_size 12m;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Uptime-check target that does not touch the API or the database.
    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI endpoints call Anthropic synchronously inside the request
        # and a long narration can run past nginx's 60s default, which the
        # user would see as a 504 while the model was still answering.
        # Every other route on this API returns in milliseconds, so a
        # generous read timeout costs nothing.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Vite emits content-hashed filenames, so these bytes can never change
    # meaning and are safe to cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html changes on every deploy (it points at the new hashed
    # bundles), so it must never be cached — a stale copy is how a browser
    # ends up requesting JavaScript the last deploy deleted.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: react-router owns /admin/cycles and friends, but they
    # are not files on disk. Without this a hard refresh or a shared link
    # 404s, while clicking the same link inside the app works fine.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
