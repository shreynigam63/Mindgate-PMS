# Agentic PMS — the web container's nginx.
#
# One origin serves two things: the built React bundle, and /api proxied
# to the API container. See frontend/Dockerfile for why that is the shape
# rather than two origins with CORS between them.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts uploads up to 10 MB (evidence attachments; the
    # employee and KRA importers cap at 5 MB). nginx's own default is 1 MB
    # and it rejects the request BEFORE the app ever sees it, so a
    # too-small value here shows up as a bare 413 from nginx with none of
    # the app's per-row error reporting. Sized above the largest limit the
    # app itself enforces, so the app is always the thing that says no.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Load-balancer / uptime-check target that does not wake the API.
    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        # Docker's embedded DNS, resolved through a VARIABLE on purpose.
        # With a literal `proxy_pass http://api:8080`, nginx resolves the
        # name once at config load and caches that IP for the life of the
        # process — so `docker compose restart api`, which normally hands
        # the container a new IP, leaves every request 502ing against an
        # address nothing is listening on until nginx is restarted too.
        # Going through $apms_api makes nginx re-resolve on the TTL.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $apms_api api;
        proxy_pass http://$apms_api:8080$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI endpoints call Anthropic synchronously inside the
        # request, and a long narration on a large cycle can sit well past
        # nginx's 60s default — which would surface to the user as a 504
        # while the model was still answering. Everything else on this API
        # returns in milliseconds, so a generous read timeout costs
        # nothing and removes a confusing failure.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Vite emits content-hashed filenames under /assets, so those bytes can
    # never change meaning — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is the one file whose contents
    # change on every deploy (it points at the new hashed bundles). A
    # cached copy is how a browser ends up asking for JavaScript that the
    # last deploy deleted.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback. react-router owns /admin/cycles and friends, but those
    # paths are not files on disk — without this, a hard refresh or a
    # shared link 404s, while clicking the same link inside the app works
    # fine (no HTTP request happens). Same rewrite render.yaml declares.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
